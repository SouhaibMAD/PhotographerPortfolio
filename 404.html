<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Supprime le chemin de base une seule fois
      const redirectBase = "/PhotographerPortfolio";
      const currentPath = window.location.pathname;

      // Si le chemin ne commence pas déjà par /PhotographerPortfolio/index.html
      if (!currentPath.startsWith(redirectBase + "/index.html")) {
        const newPath = currentPath.replace(redirectBase, "");
        window.location.replace(redirectBase + "/index.html#" + newPath);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
